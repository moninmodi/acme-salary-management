server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx drops inherited add_header directives in any location that sets its own,
    # so the security headers are included wherever headers are added.
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Same origin for UI and API: no CORS needed in the browser.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;  # Gemini questions make two model calls
    }

    # Hashed build assets can be cached forever; index.html must always be revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Client-side routes (/overview, /employees?...) fall back to the SPA.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
